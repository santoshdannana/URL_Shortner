<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Link Shortener</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-64 bg-blue-900 text-white p-6">
            <h2 class="text-xl font-bold mb-6">Link Shortener</h2>
            <ul class="space-y-4">
                <li class="hover:underline cursor-pointer">Home</li>
                <li class="hover:underline cursor-pointer">Analytics</li>
                <li class="hover:underline cursor-pointer">Settings</li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col">
            <!-- Top Bar -->
            <div class="bg-white shadow p-4 flex justify-between items-center">
                <h1 class="text-xl font-semibold text-gray-800">Dashboard</h1>
            </div>

            <!-- Body -->
            <div class="flex-1 p-8 bg-gray-50">
                <div class="max-w-xl mx-auto bg-white p-6 rounded shadow">
                    <form method="POST" class="space-y-6">
                        <div>
                            <label class="block text-gray-700 font-semibold mb-1">Enter Long URL</label>
                            <input name="url" type="text" placeholder="https://example.com" required
                                class="w-full border border-gray-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <button type="submit"
                            class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
                            Shorten
                        </button>
                    </form>

                    {% if request.method == 'POST' %}
                    <!-- Output Box -->
                    <div class="mt-6 p-4 bg-blue-50 border border-blue-300 rounded">
                        <p class="text-gray-700 font-medium mb-2">Your shortened URL:</p>
                        <div class="bg-white p-2 border border-gray-200 rounded">
                            <a href="/{{ short_code }}" class="text-blue-600 underline" target="_blank">
                                {{ short_code }}
                            </a>
                        </div>
                    </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</body>
</html>
